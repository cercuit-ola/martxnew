<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MartX — Checkout</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topnav"><div class="inner container"><div class="brand"><img src="assets/martx-wordmark.png" alt="MartX"></div><nav class="nav-links"><a href="/index.html">Home</a><a href="/marketplace.html">Marketplace</a></nav></div></header>

  <main class="container">
    <h2>Checkout</h2>
    <div style="display:grid;grid-template-columns:1fr 320px;gap:18px;padding-top:18px;">
      <div style="border-radius:20px;border:1px solid var(--border);background:var(--surface);padding:18px;">
        <div style="font-weight:800;margin-bottom:12px">Delivery</div>
        <input placeholder="Full name" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;" />
        <input placeholder="Delivery address" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);" />
        <div style="margin-top:12px"><div style="font-weight:800">Payment</div>
        <div style="display:grid;gap:8px;margin-top:8px"><button style="padding:12px;border-radius:12px;border:1px solid var(--line);">MartX Wallet — $1,845</button><button style="padding:12px;border-radius:12px;border:1px solid var(--line);">Card</button></div></div>
      </div>
      <aside style="border-radius:20px;border:1px solid var(--border);background:var(--surface);padding:18px;">Order summary<div style="margin-top:12px;font-weight:800">Gold Hoop Earrings — $24</div><div style="margin-top:12px"><a class="primary">Pay $24</a></div></aside>
    </div>
  </main>

  <footer class="footer"><div class="inner container"><div>© MartX</div><div><a href="/index.html">Home</a></div></div></footer>
</body>
</html>
