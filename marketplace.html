<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MartX — Marketplace</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topnav"><div class="inner container"><div class="brand"><img src="assets/martx-wordmark.png" alt="MartX"></div><nav class="nav-links"><a href="/index.html">Home</a><a href="/marketplace.html">Marketplace</a><a href="/tryon.html">AI Try-On</a></nav></div></header>

  <main class="container">
    <div class="section-header"><div><h2>Marketplace</h2><div style="color:var(--muted)">Vendor stores, product drops, and everyday items.</div></div><div></div></div>

    <div style="display:flex;gap:9px;overflow:auto;margin-bottom:20px;padding-bottom:6px">
      <button style="flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);">All</button>
      <button style="flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);">Try-On ready</button>
      <button style="flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);">Fashion</button>
    </div>

    <div class="card-grid">
      <article class="product-card">
        <div class="product-image" style="background-image:url('https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=900&q=80&auto=format&fit=crop');"></div>
        <div class="product-info"><div style="font-size:12px;color:var(--muted)">Zuri Studio</div><h3>Gold Hoop Earrings</h3><strong>$24</strong></div>
      </article>
      <article class="product-card">
        <div class="product-image" style="background-image:url('https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=900&q=80&auto=format&fit=crop');"></div>
        <div class="product-info"><div style="font-size:12px;color:var(--muted)">Ade Crafts</div><h3>Beaded Crown Set</h3><strong>$36</strong></div>
      </article>
      <article class="product-card">
        <div class="product-image" style="background-image:url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=900&q=80&auto=format&fit=crop');"></div>
        <div class="product-info"><div style="font-size:12px;color:var(--muted)">SoundLab</div><h3>Wireless Headphones</h3><strong>$119</strong></div>
      </article>
      <article class="product-card">
        <div class="product-image" style="background-image:url('https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=900&q=80&auto=format&fit=crop');"></div>
        <div class="product-info"><div style="font-size:12px;color:var(--muted)">Lumi Beauty</div><h3>Glow Skincare Set</h3><strong>$28</strong></div>
      </article>
    </div>
  </main>

  <footer class="footer"><div class="inner container"><div>© MartX</div><div><a href="/index.html">Home</a></div></div></footer>
</body>
</html>
