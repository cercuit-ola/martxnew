<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MartX — Auth / Sell</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topnav"><div class="inner container"><div class="brand"><img src="assets/martx-wordmark.png" alt="MartX"></div><nav class="nav-links"><a href="/index.html">Home</a><a href="/auth.html">Auth</a></nav></div></header>

  <main class="container">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:18px;align-items:center;">
      <div style="border-radius:20px;border:1px solid var(--border);background:linear-gradient(125deg,#1A0E14,#2A0C1C);color:#fff;padding:24px;">
        <h2>One account for shopping, selling & wallet.</h2>
        <p style="color:#CFC8CC">Shop live, try products on, pay from your wallet — or open a store and start selling in minutes.</p>
      </div>
      <div style="border-radius:20px;border:1px solid var(--border);background:var(--surface);padding:24px;">
        <h3>Sign in</h3>
        <input placeholder="you@example.com" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;" />
        <input placeholder="Password" type="password" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;" />
        <div><button class="primary">Sign in</button></div>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="inner container"><div>© MartX</div><div><a href="/index.html">Home</a></div></div></footer>
</body>
</html>
